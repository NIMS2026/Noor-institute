<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Login - Noor Institute</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f8fb;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      color: #075e54;
      font-size: 23px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #333;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #075e54;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #064c44;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #075e54;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Student Login</h1>

    <p class="subtitle">
      Noor Institute of Medical Sciences, Swabi
    </p>

    <form>

      <label>Student ID</label>
      <input
        type="text"
        placeholder="Enter Student ID"
        required
      >

      <label>Password</label>
      <input
        type="password"
        placeholder="Enter Password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

    <a class="back" href="index.html">
      ← Back to Home
    </a>

  </div>

</body>
</html>
